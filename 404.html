<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página no encontrada | Arena Capital</title>
  <meta name="robots" content="noindex, follow"/>
  <link rel="icon" type="image/png" href="Imagenes/Logos/Favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%}
    body{font-family:'Inter',sans-serif;background:#EDEAE2;color:#1C1C1C;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center}
    .wrap{max-width:520px}
    .code{font-family:'Playfair Display',serif;font-size:clamp(4rem,12vw,7rem);font-weight:400;color:#A04732;line-height:1;margin-bottom:1rem}
    h1{font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(1.4rem,3.5vw,2rem);margin-bottom:.8rem;color:#1C1C1C}
    h1 em{font-style:italic;color:#A04732}
    p{color:#595959;font-size:1rem;line-height:1.6;margin-bottom:2rem}
    a{display:inline-block;background:#A04732;color:#fff;padding:.85rem 1.8rem;text-decoration:none;font-weight:500;font-size:.95rem;letter-spacing:.02em;transition:background .2s}
    a:hover{background:#1C1C1C}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Esta página <em>no existe</em>.</h1>
    <p>El enlace puede haber cambiado o la página fue movida.</p>
    <a href="/">Regresar al inicio</a>
  </div>
</body>
</html>
